<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070810">
<title>MP3 播放器 | 聲徑 Studio</title>
<style>
  :root{
    --bg:#070810;
    --panel:rgba(255,255,255,.045);
    --panel-2:rgba(255,255,255,.03);
    --stroke:rgba(255,255,255,.09);
    --stroke-soft:rgba(255,255,255,.055);
    --text:#eef0f8;
    --muted:#8b90a8;
    --a1:#7c5cff;
    --a2:#22d3ee;
    --a3:#f472b6;
    --radius:26px;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 720px at 10% -12%, rgba(124,92,255,.30), transparent 62%),
      radial-gradient(880px 600px at 96% -4%, rgba(34,211,238,.18), transparent 58%),
      radial-gradient(820px 760px at 58% 118%, rgba(244,114,182,.14), transparent 62%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(120% 90% at 50% 0%, #000 20%, transparent 78%);
    -webkit-mask-image:radial-gradient(120% 90% at 50% 0%, #000 20%, transparent 78%);
    z-index:0;
  }

  .app{
    position:relative;
    z-index:1;
    max-width:1180px;
    min-height:100vh;
    margin:0 auto;
    padding:38px 22px 40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:22px;
  }

  /* ---------- Header ---------- */
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;
    display:grid;place-items:center;
    background:linear-gradient(140deg,var(--a1),var(--a2) 55%,var(--a3));
    box-shadow:0 12px 30px -12px rgba(124,92,255,.9), inset 0 1px 0 rgba(255,255,255,.35);
    color:#0b0c15;
  }
  .logo svg{width:24px;height:24px}
  .brand-text h1{
    margin:0;
    font-size:21px;
    letter-spacing:-.02em;
    font-weight:700;
  }
  .brand-text h1 span{
    background:linear-gradient(90deg,var(--a1),var(--a2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .brand-text p{
    margin:3px 0 0;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.02em;
  }
  .hint{
    font-size:12px;
    color:var(--muted);
    padding:9px 14px;
    border:1px solid var(--stroke-soft);
    border-radius:999px;
    background:rgba(255,255,255,.03);
    backdrop-filter:blur(10px);
    white-space:nowrap;
  }

  /* ---------- Layout ---------- */
  .player{
    display:grid;
    grid-template-columns:minmax(0,1.4fr) minmax(0,.92fr);
    gap:20px;
    align-items:stretch;
  }
  .panel{
    position:relative;
    border:1px solid var(--stroke);
    border-radius:var(--radius);
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.022));
    box-shadow:0 40px 80px -50px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(22px) saturate(130%);
    -webkit-backdrop-filter:blur(22px) saturate(130%);
  }
  .stage{padding:26px 26px 22px;display:flex;flex-direction:column}

  /* ---------- Now playing ---------- */
  .now{display:flex;align-items:center;gap:18px;min-height:126px}
  .art{
    position:relative;
    flex:0 0 auto;
    width:122px;height:122px;
    border-radius:50%;
    display:grid;place-items:center;
    background:
      repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.045) 0 1px, transparent 1px 5px),
      radial-gradient(circle at 50% 45%, #171a2b 0 32%, #0a0b13 34% 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),
               inset 0 0 40px rgba(0,0,0,.9),
               0 24px 44px -22px rgba(0,0,0,.95);
  }
  .art::after{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 22%, rgba(255,255,255,.16), transparent 42%);
    pointer-events:none;
  }
  .art-shine{
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(124,92,255,0) 0deg,
      rgba(124,92,255,.75) 45deg,
      rgba(34,211,238,0) 110deg,
      rgba(34,211,238,.65) 180deg,
      rgba(244,114,182,0) 245deg,
      rgba(244,114,182,.7) 315deg,
      rgba(124,92,255,0) 360deg);
    filter:blur(7px);
    opacity:.45;
    animation:spin 9s linear infinite;
    animation-play-state:paused;
    transition:opacity .4s ease;
  }
  .is-playing .art-shine{animation-play-state:running;opacity:.75}
  .art-label{
    position:relative;
    z-index:1;
    width:48px;height:48px;
    border-radius:50%;
    display:grid;place-items:center;
    color:#0a0b14;
    background:linear-gradient(140deg,var(--a2),var(--a1) 60%,var(--a3));
    box-shadow:0 0 26px rgba(124,92,255,.65), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .art-label svg{width:22px;height:22px}
  .is-playing .art-label{animation:pulse 2.6s ease-in-out infinite}

  .now-text{min-width:0}
  .now-kicker{
    display:flex;align-items:center;gap:7px;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }
  .now-kicker .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    transition:background .3s ease, box-shadow .3s ease;
  }
  .is-playing .now-kicker .dot{
    background:var(--a2);
    box-shadow:0 0 0 4px rgba(34,211,238,.16);
    animation:blink 1.8s ease-in-out infinite;
  }
  .now-text h2{
    margin:0;
    font-size:clamp(18px,2.3vw,24px);
    font-weight:650;
    letter-spacing:-.02em;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .now-text p{
    margin:7px 0 10px;
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .badge{
    display:inline-block;
    font-size:9.5px;
    letter-spacing:.14em;
    font-weight:600;
    padding:4px 9px;
    border-radius:999px;
    color:#b9c0dc;
    background:rgba(255,255,255,.055);
    border:1px solid var(--stroke);
  }

  /* ---------- Visualizer ---------- */
  .viz-wrap{
    position:relative;
    height:122px;
    margin:20px 0 4px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--stroke-soft);
    background:
      radial-gradient(120% 150% at 50% 105%, rgba(124,92,255,.18), transparent 68%),
      rgba(0,0,0,.22);
  }
  .viz-wrap canvas{display:block;width:100%;height:100%}

  /* ---------- Progress ---------- */
  .progress{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;
    gap:12px;
    margin-top:14px;
  }
  .time{
    font-size:11.5px;
    font-variant-numeric:tabular-nums;
    color:var(--muted);
    letter-spacing:.04em;
    min-width:38px;
  }
  .time:last-child{text-align:right}
  .seek{position:relative;height:22px;display:flex;align-items:center}
  .seek-track{
    position:absolute;
    left:0;right:0;
    height:6px;
    border-radius:999px;
    background:rgba(255,255,255,.10);
    overflow:hidden;
  }
  .seek-buffer{
    position:absolute;inset:0 auto 0 0;
    width:0%;
    background:rgba(255,255,255,.14);
    transition:width .25s linear;
  }
  .seek-fill{
    position:absolute;inset:0 auto 0 0;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,var(--a1),var(--a2) 70%,var(--a3));
    box-shadow:0 0 14px rgba(124,92,255,.65);
  }
  .seek-input{
    position:absolute;
    inset:0;
    width:100%;
    height:22px;
    margin:0;
    background:transparent;
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    z-index:2;
  }
  .seek-input::-webkit-slider-runnable-track{height:22px;background:transparent}
  .seek-input::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;height:14px;
    margin-top:4px;
    border-radius:50%;
    background:#fff;
    border:none;
    box-shadow:0 0 0 4px rgba(124,92,255,.22), 0 3px 10px rgba(0,0,0,.6);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .seek-input:hover::-webkit-slider-thumb,
  .seek-input:focus-visible::-webkit-slider-thumb{
    transform:scale(1.15);
    box-shadow:0 0 0 6px rgba(124,92,255,.26), 0 3px 12px rgba(0,0,0,.65);
  }
  .seek-input::-moz-range-track{height:22px;background:transparent;border:none}
  .seek-input::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:#fff;
    box-shadow:0 0 0 4px rgba(124,92,255,.22), 0 3px 10px rgba(0,0,0,.6);
  }

  /* ---------- Controls ---------- */
  .controls{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:14px;
    margin-top:16px;
  }
  .ctrl-left{display:flex;align-items:center;gap:9px;justify-self:start;min-width:0}
  .ctrl-main{display:flex;align-items:center;gap:7px;justify-self:center}
  .ctrl-right{display:flex;align-items:center;gap:8px;justify-self:end}

  button{font:inherit;color:inherit}
  .icon-btn{
    position:relative;
    width:40px;height:40px;
    display:grid;place-items:center;
    border-radius:50%;
    border:1px solid transparent;
    background:rgba(255,255,255,.045);
    color:#aab0c8;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, transform .18s ease, border-color .18s ease;
    flex:0 0 auto;
  }
  .icon-btn:hover{background:rgba(255,255,255,.10);color:#fff;transform:translateY(-1px)}
  .icon-btn:active{transform:translateY(0) scale(.96)}
  .icon-btn svg{width:18px;height:18px}
  .icon-btn.on{
    color:#dfe2ff;
    background:linear-gradient(140deg, rgba(124,92,255,.35), rgba(34,211,238,.22));
    border-color:rgba(124,92,255,.5);
    box-shadow:0 0 18px -4px rgba(124,92,255,.7);
  }
  .icon-btn .badge{
    position:absolute;
    right:-2px;bottom:-2px;
    display:none;
    min-width:15px;height:15px;
    padding:0 4px;
    place-items:center;
    font-size:9px;
    font-weight:700;
    letter-spacing:0;
    color:#0a0b14;
    background:var(--a2);
    border:none;
    border-radius:999px;
    box-shadow:0 0 10px rgba(34,211,238,.8);
  }
  .icon-btn[data-mode="one"] .badge{display:grid}

  .play-btn{
    width:62px;height:62px;
    margin:0 6px;
    display:grid;place-items:center;
    border-radius:50%;
    border:none;
    cursor:pointer;
    color:#0a0b14;
    background:linear-gradient(145deg,#a99bff,var(--a1) 38%,var(--a2) 100%);
    box-shadow:0 16px 34px -14px rgba(124,92,255,.95),
               0 0 0 1px rgba(255,255,255,.14) inset,
               0 0 34px -6px rgba(34,211,238,.55);
    transition:transform .18s ease, box-shadow .25s ease, filter .2s ease;
  }
  .play-btn:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.06)}
  .play-btn:active{transform:scale(.96)}
  .play-btn svg{width:26px;height:26px}
  .play-btn .i-pause{display:none}
  .is-playing .play-btn .i-play{display:none}
  .is-playing .play-btn .i-pause{display:block}

  /* volume */
  #volume{
    -webkit-appearance:none;
    appearance:none;
    width:88px;
    height:6px;
    border-radius:999px;
    margin:0;
    cursor:pointer;
    background-image:linear-gradient(90deg,var(--a1),var(--a2));
    background-size:var(--v,80%) 100%;
    background-repeat:no-repeat;
    background-color:rgba(255,255,255,.13);
  }
  #volume::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;height:12px;
    border:none;border-radius:50%;
    background:#fff;
    box-shadow:0 0 0 3px rgba(124,92,255,.25), 0 2px 8px rgba(0,0,0,.55);
  }
  #volume::-moz-range-track{height:6px;border:none;border-radius:999px;background:transparent}
  #volume::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(124,92,255,.25)}
  .vol-label{
    font-size:10.5px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    min-width:34px;
  }
  .icon-btn .i-mute{display:none}
  .icon-btn.is-muted .i-vol{display:none}
  .icon-btn.is-muted .i-mute{display:block}

  .speed{
    font-size:11px;
    color:var(--muted);
    letter-spacing:.06em;
  }
  #speed{
    -webkit-appearance:none;
    appearance:none;
    padding:8px 10px;
    border-radius:11px;
    border:1px solid var(--stroke);
    background:rgba(255,255,255,.045);
    color:#dfe3f2;
    font-size:12px;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
    transition:border-color .18s ease, background .18s ease;
  }
  #speed:hover{background:rgba(255,255,255,.09);border-color:rgba(124,92,255,.45)}
  #speed:focus-visible{outline:2px solid rgba(124,92,255,.7);outline-offset:2px}

  /* ---------- Playlist ---------- */
  .playlist{padding:22px 20px 18px;display:flex;flex-direction:column;min-height:0}
  .pl-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:14px;
  }
  .pl-head h2{
    margin:0;
    font-size:14px;
    font-weight:600;
    letter-spacing:.01em;
    display:flex;align-items:center;gap:8px;
  }
  .count{
    font-size:10.5px;
    font-weight:600;
    color:#c3c9e4;
    background:rgba(255,255,255,.07);
    border:1px solid var(--stroke);
    border-radius:999px;
    padding:2px 8px;
    font-variant-numeric:tabular-nums;
  }
  .ghost-btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:7px 12px;
    font-size:11.5px;
    border-radius:999px;
    border:1px solid var(--stroke);
    background:rgba(255,255,255,.04);
    color:#cdd3e8;
    cursor:pointer;
    transition:background .18s ease, border-color .18s ease, color .18s ease;
  }
  .ghost-btn:hover{background:rgba(124,92,255,.22);border-color:rgba(124,92,255,.55);color:#fff}

  .dropzone{
    display:flex;align-items:center;gap:12px;
    width:100%;
    padding:12px 14px;
    text-align:left;
    border-radius:16px;
    border:1px dashed rgba(255,255,255,.16);
    background:rgba(255,255,255,.022);
    cursor:pointer;
    color:var(--muted);
    transition:border-color .2s ease, background .2s ease, color .2s ease;
  }
  .dropzone:hover,.dropzone:focus-visible{
    border-color:rgba(124,92,255,.6);
    background:rgba(124,92,255,.10);
    color:#d7dbf0;
    outline:none;
  }
  .dropzone svg{width:20px;height:20px;flex:0 0 auto;opacity:.85}
  .dropzone span{display:flex;flex-direction:column;gap:2px;min-width:0}
  .dropzone strong{font-size:12px;font-weight:600;color:#d9ddf0}
  .dropzone small{font-size:10.5px;color:var(--muted)}

  .list{
    list-style:none;
    margin:14px -6px 0;
    padding:0 6px;
    flex:1;
    min-height:0;
    max-height:318px;
    overflow-y:auto;
    overscroll-behavior:contain;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .list::-webkit-scrollbar{width:6px}
  .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:999px}
  .list::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}

  .track{
    display:flex;align-items:center;
    gap:4px;
    border-radius:13px;
    border:1px solid transparent;
    transition:background .16s ease, border-color .16s ease;
  }
  .track:hover{background:rgba(255,255,255,.05)}
  .track.active{
    background:linear-gradient(90deg, rgba(124,92,255,.24), rgba(34,211,238,.08));
    border-color:rgba(124,92,255,.32);
  }
  .track-btn{
    flex:1;
    min-width:0;
    display:flex;align-items:center;gap:11px;
    padding:9px 8px 9px 10px;
    background:none;border:none;
    text-align:left;
    cursor:pointer;
    border-radius:13px;
  }
  .t-lead{
    flex:0 0 auto;
    width:18px;
    display:grid;place-items:center;
    font-size:10.5px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .track.active .t-lead{color:#cbd1ee}
  .eq{display:flex;align-items:flex-end;gap:2px;height:13px}
  .eq i{
    width:2px;height:100%;border-radius:2px;
    background:linear-gradient(180deg,var(--a2),var(--a1));
    transform-origin:bottom;
    transform:scaleY(.3);
    animation:eq .9s ease-in-out infinite alternate;
    animation-play-state:paused;
  }
  .eq i:nth-child(2){animation-delay:-.3s}
  .eq i:nth-child(3){animation-delay:-.6s}
  .eq i:nth-child(4){animation-delay:-.15s}
  .track.playing .eq i{animation-play-state:running}
  .t-text{display:flex;flex-direction:column;gap:2px;min-width:0}
  .t-name{
    font-size:12.5px;
    color:#e3e7f5;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .track.active .t-name{font-weight:600;color:#fff}
  .t-sub{
    font-size:10.5px;
    color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-variant-numeric:tabular-nums;
  }
  .t-remove{
    flex:0 0 auto;
    width:28px;height:28px;
    margin-right:6px;
    display:grid;place-items:center;
    border:none;border-radius:9px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    opacity:0;
    transition:opacity .16s ease, background .16s ease, color .16s ease;
  }
  .t-remove svg{width:14px;height:14px}
  .track:hover .t-remove,.t-remove:focus-visible{opacity:1}
  .t-remove:hover{background:rgba(244,114,182,.18);color:#ffd3e7}
  .empty{
    padding:26px 10px;
    text-align:center;
    font-size:12px;
    color:var(--muted);
    line-height:1.7;
  }
  .demo-btn{
    margin-top:12px;
    padding:11px;
    width:100%;
    font-size:12px;
    letter-spacing:.02em;
    border-radius:14px;
    border:1px solid var(--stroke);
    background:rgba(255,255,255,.035);
    color:#c9cfec;
    cursor:pointer;
    transition:background .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .demo-btn:hover{
    background:linear-gradient(120deg, rgba(124,92,255,.24), rgba(34,211,238,.16));
    border-color:rgba(124,92,255,.5);
    color:#fff;
    box-shadow:0 0 24px -10px rgba(124,92,255,.9);
  }

  .foot{
    text-align:center;
    font-size:11px;
    color:rgba(139,144,168,.75);
    letter-spacing:.03em;
  }

  /* ---------- Overlay / Toast ---------- */
  .overlay{
    position:fixed;
    inset:0;
    z-index:50;
    display:grid;
    place-items:center;
    padding:24px;
    background:rgba(7,8,16,.72);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
  }
  .overlay.on{opacity:1}
  .overlay-inner{
    width:min(520px,100%);
    padding:56px 28px;
    text-align:center;
    border-radius:26px;
    border:2px dashed rgba(124,92,255,.55);
    background:linear-gradient(160deg, rgba(124,92,255,.16), rgba(34,211,238,.07));
    box-shadow:0 0 80px -20px rgba(124,92,255,.7) inset;
  }
  .overlay-inner svg{width:44px;height:44px;color:#c3b8ff}
  .overlay-inner p{margin:14px 0 0;font-size:15px;font-weight:600;letter-spacing:.02em}
  .overlay-inner small{display:block;margin-top:6px;font-size:11.5px;color:var(--muted)}

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%,16px);
    z-index:60;
    padding:11px 18px;
    font-size:12.5px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(20,22,36,.92);
    color:#e9ecf9;
    box-shadow:0 20px 40px -18px rgba(0,0,0,.9);
    backdrop-filter:blur(12px);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    max-width:calc(100vw - 40px);
    text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  :focus-visible{outline:2px solid rgba(124,92,255,.85);outline-offset:3px}
  button:focus:not(:focus-visible){outline:none}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 22px rgba(124,92,255,.55)}50%{box-shadow:0 0 36px rgba(34,211,238,.8)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes eq{from{transform:scaleY(.22)}to{transform:scaleY(1)}}

  @media (max-width:920px){
    .player{grid-template-columns:1fr}
    .list{max-height:260px}
  }
  @media (max-width:720px){
    .app{padding:24px 14px 30px;gap:16px}
    .hint{display:none}
    .stage{padding:20px 18px 18px}
    .playlist{padding:18px 14px 14px}
    .controls{grid-template-columns:1fr;justify-items:center;gap:16px}
    .ctrl-main{order:-1;justify-self:center}
    .ctrl-left,.ctrl-right{justify-self:center}
    .now{min-height:0;gap:14px}
    .art{width:96px;height:96px}
    .art-label{width:40px;height:40px}
    .now-text h2{font-size:18px}
    .viz-wrap{height:96px;margin-top:16px}
    .foot{font-size:10.5px;line-height:1.8}
    .vol-label{display:none}
    #volume{width:110px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Pulse<span>Player</span></h1>
        <p>MP3 播放器 · Web Audio 頻譜視覺化</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div class="hint">拖放 MP3 到頁面任一處即可加入</div><a href="index.html" style="color:#e7e1ff;text-decoration:none;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 14px;font-size:13px">← 返回聲徑 Studio</a></div>
  </header>

  <main class="player">
    <section class="panel stage" aria-label="播放器">
      <div class="now">
        <div class="art" id="art">
          <div class="art-shine" aria-hidden="true"></div>
          <div class="art-label" aria-hidden="true">

            </svg>

        </div>
        <div class="now-text">
          <div class="now-kicker"><span class="dot"></span>正在播放</div>
          <h2 id="title">尚未選擇曲目</h2>
          <p id="artist">加入 MP3 或載入示範音訊開始播放</p>
          <span class="badge" id="badge">IDLE</span>

      </div>

      <div class="viz-wrap">

      <div class="progress">

        <div class="seek">

          <input id="seek" class="seek-input" type="range" min="0" max="1000" value="0" step="1" aria-label="播放進度">
        </div>
        <span class="time" id="dur">00:00</span>
      </div>

      <div class="controls">
        <div class="ctrl-left">
          <button class="icon-btn" id="mute" type="button" title="靜音" aria-label="靜音">
            <svg class="i-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.6a5 5 0 0 1 0 6.8"/><path d="M18.6 5.6a9.4 9.4 0 0 1 0 12.8"/>
            </svg>
            <svg class="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/>
            </svg>
          </button>
          <input id="volume" type="range" min="0" max="100" value="80" step="1" aria-label="音量">
          <span class="vol-label" id="volLabel">80%</span>
        </div>

        <div class="ctrl-main">
          <button class="icon-btn" id="shuffle" type="button" title="隨機播放" aria-label="隨機播放" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h3.2l3.3 4.2"/><path d="M3 18h3.2L17 6h4"/>
              <path d="M18 3l3 3-3 3"/><path d="M18 15l3 3-3 3"/><path d="M13.4 13.6L17 18h4"/>
            </svg>
          </button>
          <button class="icon-btn" id="prev" type="button" title="上一首" aria-label="上一首">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M19.2 5.2v13.6a1 1 0 0 1-1.53.85l-9.9-6.8a1 1 0 0 1 0-1.7l9.9-6.8a1 1 0 0 1 1.53.85z"/>
              <rect x="4" y="5" width="2.4" height="14" rx="1.2"/>
            </svg>
          </button>
          <button class="play-btn" id="play" type="button" title="播放" aria-label="播放">
            <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8.2 5.4v13.2a1 1 0 0 0 1.53.85l10.3-6.6a1 1 0 0 0 0-1.7L9.73 4.55A1 1 0 0 0 8.2 5.4z"/>
            </svg>
            <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="6.8" y="5" width="3.8" height="14" rx="1.4"/>
              <rect x="13.4" y="5" width="3.8" height="14" rx="1.4"/>

          </button>
          <button class="icon-btn" id="next" type="button" title="下一首" aria-label="下一首">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M4.8 5.2v13.6a1 1 0 0 0 1.53.85l9.9-6.8a1 1 0 0 0 0-1.7l-9.9-6.8A1 1 0 0 0 4.8 5.2z"/>
              <rect x="17.6" y="5" width="2.4" height="14" rx="1.2"/>
            </svg>
          </button>
          <button class="icon-btn" id="repeat" type="button" title="循環模式" aria-label="不循環" aria-pressed="false" data-mode="off">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17 2.5l3.5 3.5L17 9.5"/><path d="M3.5 11.5V9a3.5 3.5 0 0 1 3.5-3.5h13"/>
              <path d="M7 21.5L3.5 18 7 14.5"/><path d="M20.5 12.5V15a3.5 3.5 0 0 1-3.5 3.5H4"/>
            </svg>
            <span class="badge" aria-hidden="true">1</span>
          </button>
        </div>

        <div class="ctrl-right">
          <label class="speed" for="speed">速度</label>
          <select id="speed" aria-label="播放速度">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1.0×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2.0×</option>
          </select>
        </div>
      </div>
    </section>

    <aside class="panel playlist" aria-label="播放清單">
      <div class="pl-head">
        <h2>播放清單 <span class="count" id="count">0</span></h2>
        <button class="ghost-btn" id="pick" type="button">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          加入
        </button>
      </div>

      <button class="dropzone" id="dropzone" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/>
          <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>
        </svg>
        <span>
          <strong>拖放或點擊加入 MP3</strong>
          <small>支援一次多選多個檔案</small>
        </span>
      </button>

      <ul class="list" id="list"></ul>

      <button class="demo-btn" id="demo" type="button">載入示範音訊</button>
    </aside>
  </main>

  <footer class="foot">空白鍵 播放／暫停 · ← → 快進 5 秒 · ↑ ↓ 音量 · M 靜音</footer>
</div>

<input type="file" id="file" accept=".mp3,audio/mpeg,audio/*" multiple hidden>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="overlay-inner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/>
      <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>
    </svg>
    <p>放開以加入播放清單</p>
    <small>支援 MP3 與其他音訊格式</small>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);

  const DEMOS = [
    {
      name: 'Outfoxing',
      artist: 'MDN Web Audio 示範',
      url: 'https://mdn.github.io/webaudio-examples/audio-basics/outfoxing.mp3'
    },
    {
      name: 'Viper',
      artist: 'MDN Web Audio 示範',
      url: 'https://mdn.github.io/webaudio-examples/audio-analyser/viper.mp3'
    }
  ];

  /* ---------------- Audio element ---------------- */
  const audio = new Audio();
  audio.preload = 'metadata';
  // crossOrigin 依曲目來源動態設定（本機 Blob 設 null 以免 CORS 檢查失敗）
  audio.volume = 0.8;

  const state = {
    tracks: [],
    current: -1,
    playing: false,
    repeat: 'off',        // off | all | one
    shuffle: false,
    seeking: false,
    lastVolume: 0.8
  };

  const el = {
    list: $('list'), count: $('count'), pick: $('pick'), file: $('file'),
    play: $('play'), prev: $('prev'), next: $('next'),
    shuffle: $('shuffle'), repeat: $('repeat'),
    seek: $('seek'), seekFill: $('seekFill'), seekBuffer: $('seekBuffer'),
    cur: $('cur'), dur: $('dur'),
    volume: $('volume'), mute: $('mute'), volLabel: $('volLabel'),
    speed: $('speed'),
    title: $('title'), artist: $('artist'), badge: $('badge'), art: $('art'),
    canvas: $('viz'), overlay: $('overlay'), toast: $('toast'),
    demo: $('demo'), dropzone: $('dropzone')
  };

  /* ---------------- Helpers ---------------- */
  let uidSeed = 0;
  const uid = () => `t${Date.now().toString(36)}${(uidSeed++).toString(36)}`;

  function fmt(sec) {
    if (!Number.isFinite(sec) || sec < 0) return '00:00';
    const s = Math.floor(sec % 60);
    const m = Math.floor((sec / 60) % 60);
    const h = Math.floor(sec / 3600);
    const pad = (n) => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }

  let toastTimer = 0;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2200);
  }

  /* ---------------- Web Audio graph ---------------- */
  let actx = null;
  let analyser = null;
  let freq = null;
  let mediaSource = null;
  let rafId = 0;

  function ensureGraph() {
    if (actx) {
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const ctx = new AC();
      const src = ctx.createMediaElementSource(audio);
      const node = ctx.createAnalyser();
      node.fftSize = 2048;
      node.smoothingTimeConstant = 0.8;
      node.minDecibels = -92;
      node.maxDecibels = -12;
      src.connect(node);
      node.connect(ctx.destination);

      actx = ctx;
      mediaSource = src;
      analyser = node;
      freq = new Uint8Array(node.frequencyBinCount);
    } catch (err) {
      // 建立失敗時保留「未連線」狀態，下次點擊播放可重試
      actx = null;
      mediaSource = null;
      analyser = null;
      freq = null;
      if (!window.AudioContext && !window.webkitAudioContext) {
        toast('此瀏覽器不支援 Web Audio，將以無頻譜模式播放');
      }
    }
  }

  // 資源釋放：audio 為常駐元素，MediaElementSource 一旦建立即綁定且無法重接。
  // 頁面卸载時關閉 AudioContext；BFCache 進 page cache 時僅 suspend（audio 仍在播放），
  // 於 pageshow 還原時 resume，避免關閉後 createMediaElementSource 再次失敗。
  function unloadGraph() {
    const ctx = actx;
    actx = null;
    analyser = null;
    freq = null;
    mediaSource = null;
    if (ctx && ctx.state !== 'closed') {
      ctx.close().catch(() => {});
    }
  }

  window.addEventListener('pagehide', (e) => {
    if (e.persisted) {
      if (actx && actx.state === 'running') actx.suspend().catch(() => {});
      return;
    }
    unloadGraph();
  });

  window.addEventListener('pageshow', (e) => {
    if (!e.persisted) return;
    // BFCache 還原：AudioContext 可能已中斷，且 canvas 尺寸可能改變，重啟視覺化
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    resizeViz();
    startViz();
  });

  function isReducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  /* ---------------- Playlist ---------------- */
  function renderPlaylist() {
    const scrollTop = el.list.scrollTop;
    el.list.textContent = '';
    el.count.textContent = String(state.tracks.length);

    if (!state.tracks.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '播放清單是空的，加入 MP3 或載入示範音訊開始聆聽。';
      el.list.appendChild(li);
      return;
    }

    const frag = document.createDocumentFragment();

    state.tracks.forEach((track, i) => {
      const li = document.createElement('li');
      li.className = 'track';
      if (i === state.current) {
        li.classList.add('active');
        if (state.playing) li.classList.add('playing');
      }

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'track-btn';
      btn.setAttribute('aria-label', `播放 ${track.name}`);

      const lead = document.createElement('span');
      lead.className = 't-lead';
      if (i === state.current) {
        lead.innerHTML = '<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';
      } else {
        lead.textContent = String(i + 1).padStart(2, '0');
      }

      const text = document.createElement('span');
      text.className = 't-text';

      const name = document.createElement('span');
      name.className = 't-name';
      name.textContent = track.name;

      const sub = document.createElement('span');
      sub.className = 't-sub';
      const kind = track.local ? '本機檔案' : (track.artist || '示範音訊');
      sub.textContent = Number.isFinite(track.duration)
        ? `${kind} · ${fmt(track.duration)}`
        : kind;

      text.append(name, sub);
      btn.append(lead, text);
      btn.addEventListener('click', () => {
        if (i === state.current) {
          togglePlay();
        } else {
          load(i, true);
        }
      });

      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 't-remove';
      rm.setAttribute('aria-label', `移除 ${track.name}`);
      rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      rm.addEventListener('click', (e) => {
        e.stopPropagation();
        removeTrack(track.id);
      });

      li.append(btn, rm);
      frag.appendChild(li);
    });

    el.list.appendChild(frag);
    el.list.scrollTop = scrollTop;
  }

  function addFiles(fileList) {
    const files = Array.from(fileList || []).filter(
      (f) => (f.type && f.type.startsWith('audio/')) || /\.(mp3|m4a|wav|ogg|flac|aac)$/i.test(f.name)
    );

    if (!files.length) {
      toast('請選擇 MP3 或音訊檔案');
      return;
    }

    const start = state.tracks.length;

    files.forEach((f) => {
      state.tracks.push({
        id: uid(),
        name: f.name.replace(/\.[^.]+$/, ''),
        url: URL.createObjectURL(f),
        local: true,
        duration: NaN
      });
    });

    renderPlaylist();

    if (state.current === -1) {
      load(start, true);
    } else {
      toast(`已加入 ${files.length} 個檔案`);
    }
  }

  function addDemoTracks(notify = true) {
    let added = 0;
    DEMOS.forEach((d) => {
      if (state.tracks.some((t) => t.url === d.url)) return;
      state.tracks.push({
        id: uid(),
        name: d.name,
        artist: d.artist,
        url: d.url,
        local: false,
        duration: NaN
      });
      added++;
    });

    if (!added) {
      if (notify) toast('示範音訊已在播放清單中');
      return;
    }

    renderPlaylist();
    if (state.current === -1) load(0, false);
    if (notify) toast('已載入示範音訊');
  }

  function removeTrack(id) {
    const i = state.tracks.findIndex((t) => t.id === id);
    if (i < 0) return;

    const wasCurrent = i === state.current;
    const wasPlaying = state.playing;
    const [removed] = state.tracks.splice(i, 1);
    if (removed.local) URL.revokeObjectURL(removed.url);

    if (wasCurrent) {
      audio.pause();
      // audio.src = '' 才能讓部分瀏覽器真正釋放資源（removeAttribute 不一定觸發 abort）
      audio.src = '';
      audio.load();
      state.current = -1;
      state.playing = false;
      updatePlayUI();

      if (state.tracks.length) {
        load(Math.min(i, state.tracks.length - 1), false);
        // 原曲目正在播放時，延續播放意圖並讓載入失敗可見（quiet=false）
        if (wasPlaying) play(false);
      } else {
        updateNowPlaying(null);
        el.seek.value = 0;
        el.seekFill.style.width = '0%';
        el.seekBuffer.style.width = '0%';
        el.cur.textContent = '00:00';
        el.dur.textContent = '00:00';
        renderPlaylist();
      }
    } else {
      if (i < state.current) state.current -= 1;
      renderPlaylist();
    }
  }

  /* ---------------- Loading / playback ---------------- */
  function load(index, autoplay = false) {
    const track = state.tracks[index];
    if (!track) return;

    state.current = index;
    state.seeking = false;

    el.seek.value = 0;
    el.seekFill.style.width = '0%';
    el.seekBuffer.style.width = '0%';
    el.cur.textContent = '00:00';
    el.dur.textContent = '00:00';

    audio.src = track.url;
    audio.playbackRate = parseFloat(el.speed.value) || 1;
    // 本機 Object URL 加 crossOrigin 會觸發 CORS 檢查而導致播放失敗；遠端需 anonymous 才能讀取頻譜
    if (track.local) {
      audio.removeAttribute('crossorigin');
      audio.crossOrigin = null;
    } else {
      audio.crossOrigin = 'anonymous';
    }
    audio.load();

    updateNowPlaying(track);
    renderPlaylist();
    updateMediaSession(track);

    if (autoplay) play(true);
  }

  function updateNowPlaying(track) {
    if (!track) {
      el.title.textContent = '尚未選擇曲目';
      el.artist.textContent = '加入 MP3 或載入示範音訊開始播放';
      el.badge.textContent = 'IDLE';
      return;
    }
    el.title.textContent = track.name;
    el.artist.textContent = track.local ? '本機檔案' : (track.artist || '示範音訊');
    el.badge.textContent = track.local ? 'LOCAL' : 'DEMO';
  }

  function updatePlayUI() {
    document.body.classList.toggle('is-playing', state.playing);
    el.play.setAttribute('aria-label', state.playing ? '暫停' : '播放');
    el.play.title = state.playing ? '暫停' : '播放';

    const active = el.list.querySelector('.track.active');
    if (active) active.classList.toggle('playing', state.playing);
  }

  async function play(quiet = false) {
    if (state.current === -1) {
      if (!state.tracks.length) {
        toast('請先加入音樂');
        return;
      }
      load(0, false);
    }

    ensureGraph();

    try {
      if (actx && actx.state === 'suspended') await actx.resume();
      await audio.play();
    } catch (err) {
      if (!quiet) toast('無法播放此音訊，請確認檔案或連結');
    }
  }

  function togglePlay() {
    if (state.playing) {
      audio.pause();
    } else {
      play();
    }
  }

  function pickShuffle() {
    const n = state.tracks.length;
    if (n <= 1) return 0;
    // current === -1（清單空或尚未選曲）時無「當前曲目」可排除，直接回傳隨機值
    if (state.current === -1) return Math.floor(Math.random() * n);
    let i = state.current;
    while (i === state.current) i = Math.floor(Math.random() * n);
    return i;
  }

  function nextTrack() {
    const n = state.tracks.length;
    if (!n) return;
    if (state.shuffle) {
      load(pickShuffle(), true);
      return;
    }
    load((state.current + 1) % n, true);
  }

  function prevTrack() {
    if (!state.tracks.length) return;
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      syncSeek();
      return;
    }
    const n = state.tracks.length;
    if (state.shuffle) {
      load(pickShuffle(), true);
      return;
    }
    load((state.current - 1 + n) % n, true);
  }

  function seekBy(delta) {
    if (!Number.isFinite(audio.duration)) return;
    audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + delta));
    syncSeek();
  }

  /* ---------------- Progress / volume ---------------- */
  function syncSeek() {
    const d = audio.duration;
    const p = Number.isFinite(d) && d > 0 ? audio.currentTime / d : 0;
    el.seek.value = String(Math.round(p * 1000));
    el.seekFill.style.width = (p * 100).toFixed(2) + '%';
    el.cur.textContent = fmt(audio.currentTime);
    el.dur.textContent = fmt(d);
  }

  function updateBuffer() {
    const d = audio.duration;
    if (!Number.isFinite(d) || d <= 0 || !audio.buffered.length) return;
    const end = audio.buffered.end(audio.buffered.length - 1);
    el.seekBuffer.style.width = Math.min(100, (end / d) * 100).toFixed(2) + '%';
  }

  function updateMuteUI() {
    const muted = audio.muted || audio.volume === 0;
    el.mute.classList.toggle('is-muted', muted);
    el.mute.setAttribute('aria-label', muted ? '取消靜音' : '靜音');
    el.mute.title = muted ? '取消靜音' : '靜音';
    el.volLabel.textContent = muted ? '靜音' : Math.round(audio.volume * 100) + '%';
  }

  function applyVolume(v, unmute = true) {
    const val = Math.max(0, Math.min(1, v));
    audio.volume = val;
    if (unmute && audio.muted) audio.muted = false;
    if (val > 0) state.lastVolume = val;

    el.volume.value = String(Math.round(val * 100));
    el.volume.style.setProperty('--v', (val * 100).toFixed(1) + '%');
    updateMuteUI();
  }

  /* ---------------- Modes ---------------- */
  function updateModeUI() {
    el.shuffle.classList.toggle('on', state.shuffle);
    el.shuffle.setAttribute('aria-pressed', String(state.shuffle));

    el.repeat.classList.toggle('on', state.repeat !== 'off');
    el.repeat.dataset.mode = state.repeat;
    el.repeat.setAttribute('aria-pressed', String(state.repeat !== 'off'));
    el.repeat.setAttribute(
      'aria-label',
      state.repeat === 'one' ? '單曲循環' : state.repeat === 'all' ? '清單循環' : '不循環'
    );
  }

  /* ---------------- Media Session ---------------- */
  function updateMediaSession(track) {
    if (!('mediaSession' in navigator) || !track) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.name,
        artist: track.local ? '本機檔案' : (track.artist || '示範音訊'),
        album: 'Pulse Player'
      });
    } catch (_) { /* 不支援時忽略 */ }
  }

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', () => play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
      navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
    } catch (_) { /* 忽略 */ }
  }

  /* ---------------- Audio events ---------------- */
  audio.addEventListener('play', () => {
    state.playing = true;
    updatePlayUI();
  });

  audio.addEventListener('pause', () => {
    state.playing = false;
    updatePlayUI();
  });

  audio.addEventListener('ended', () => {
    if (state.current === -1 || !state.tracks.length) return;

    if (state.repeat === 'one') {
      audio.currentTime = 0;
      play(true);
      return;
    }
    const n = state.tracks.length;
    if (!n) return;

    if (state.shuffle) {
      load(pickShuffle(), true);
      return;
    }
    if (state.current + 1 < n) {
      load(state.current + 1, true);
    } else if (state.repeat === 'all') {
      load(0, true);
    } else {
      audio.currentTime = 0;
      state.playing = false;
      updatePlayUI();
      syncSeek();
    }
  });

  audio.addEventListener('loadedmetadata', () => {
    const track = state.tracks[state.current];
    if (track) {
      track.duration = audio.duration;
      renderPlaylist();
    }
    el.dur.textContent = fmt(audio.duration);
    // 使用者若在 metadata 前已拖動進度條，不要覆蓋其操作
    if (!state.seeking && audio.currentTime < 0.05) {
      el.seek.value = '0';
      el.seekFill.style.width = '0%';
    }
  });

  audio.addEventListener('timeupdate', () => {
    if (!state.seeking) syncSeek();
  });

  audio.addEventListener('progress', updateBuffer);
  audio.addEventListener('durationchange', syncSeek);

  audio.addEventListener('error', () => {
    if (!audio.currentSrc) return;
    toast('音訊載入失敗，請改用本機 MP3 檔案');
  });

  /* ---------------- Visualizer ---------------- */
  const canvas = el.canvas;
  const ctx2d = canvas.getContext('2d');
  let W = 0;
  let H = 0;
  let bars = [];
  let targets = [];
  let peaks = [];
  let barGrad = null;

  function resizeViz() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.max(28, Math.min(74, Math.floor(W / 9)));
    const prevBars = bars;
    const prevPeaks = peaks;
    bars = new Array(count).fill(0);
    targets = new Array(count).fill(0);
    peaks = new Array(count).fill(0);

    if (prevBars.length) {
      for (let i = 0; i < count; i++) {
        const j = Math.min(prevBars.length - 1, Math.floor((i / count) * prevBars.length));
        bars[i] = prevBars[j];
        peaks[i] = prevPeaks[j] || 0;
      }
    }

    barGrad = ctx2d.createLinearGradient(0, H, 0, 0);
    barGrad.addColorStop(0, 'rgba(124,92,255,.95)');
    barGrad.addColorStop(0.45, 'rgba(34,211,238,.95)');
    barGrad.addColorStop(1, 'rgba(244,114,182,.95)');

    // 重設尺寸後立即重繪，並確保 reduced-motion 下仍有畫面（不啟動 rAF）
    if (isReducedMotion()) drawStaticFrame();
    else if (!rafId && !document.hidden) startViz();
  }

  function roundRect(c, x, y, w, h, r) {
    const rad = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    if (typeof c.roundRect === 'function') {
      c.roundRect(x, y, w, h, rad);
      return;
    }
    c.moveTo(x + rad, y);
    c.lineTo(x + w - rad, y);
    c.quadraticCurveTo(x + w, y, x + w, y + rad);
    c.lineTo(x + w, y + h - rad);
    c.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
    c.lineTo(x + rad, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - rad);
    c.lineTo(x, y + rad);
    c.quadraticCurveTo(x, y, x + rad, y);
    c.closePath();
  }

  // 非重複 scheduling：draw() 內不再自行 rAF，改由 startViz()/stopViz() 控制，
  // 避免 prefers-reduced-motion 切換時疊加多條迴圈。
  function startViz() {
    if (rafId || isReducedMotion()) return;
    if (state.playing) ensureGraph();
    rafId = requestAnimationFrame(draw);
  }

  function stopViz() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  function draw(ts) {
    rafId = 0;
    if (!W || !H || !bars.length) return;
    if (isReducedMotion()) {
      stopViz();
      drawStaticFrame();
      return;
    }

    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});

    const n = bars.length;
    const playing = state.playing;
    ctx2d.clearRect(0, 0, W, H);

    if (analyser && playing) {
      analyser.getByteFrequencyData(freq);
      const bins = freq.length;
      const limit = Math.floor(bins * 0.72);

      for (let i = 0; i < n; i++) {
        const a = Math.floor(Math.pow(i / n, 1.8) * limit);
        const b = Math.max(a + 1, Math.floor(Math.pow((i + 1) / n, 1.8) * limit));
        let sum = 0;
        let peak = 0;
        let cnt = 0;

        for (let j = a; j < b; j++) {
          const v = freq[j];
          sum += v;
          if (v > peak) peak = v;
          cnt++;
        }

        const v = cnt ? (sum / cnt) * 0.55 + peak * 0.45 : 0;
        targets[i] = Math.min(1, Math.pow(v / 255, 1.3) * 1.45);
      }
    } else {
      const t = ts * 0.001;
      for (let i = 0; i < n; i++) {
        const s1 = 0.5 + 0.5 * Math.sin(t * 1.5 + i * 0.3);
        const s2 = 0.5 + 0.5 * Math.sin(t * 0.8 + i * 0.13 + 2);
        const shape = 0.55 + 0.45 * Math.sin(Math.PI * (i / (n - 1)));
        targets[i] = (0.09 + 0.2 * (s1 * 0.65 + s2 * 0.35)) * shape;
      }
    }

    const ease = playing ? 0.34 : 0.06;
    for (let i = 0; i < n; i++) {
      bars[i] += (targets[i] - bars[i]) * ease;
      peaks[i] = Math.max(bars[i], peaks[i] - 0.006);
    }

    paintBars();

    if (!isReducedMotion() && !document.hidden) {
      rafId = requestAnimationFrame(draw);
    }
  }

  // prefers-reduced-motion 下的單幀靜態繪製：無 rAF、無時間插值
  function drawStaticFrame() {
    if (!W || !H || !bars.length) return;
    const n = bars.length;

    if (analyser && state.playing && freq) {
      analyser.getByteFrequencyData(freq);
      const limit = Math.floor(freq.length * 0.72);
      for (let i = 0; i < n; i++) {
        const a = Math.floor(Math.pow(i / n, 1.8) * limit);
        const b = Math.max(a + 1, Math.floor(Math.pow((i + 1) / n, 1.8) * limit));
        let sum = 0;
        for (let j = a; j < b; j++) sum += freq[j];
        bars[i] = Math.min(1, (sum / Math.max(1, b - a)) / 255 * 0.9);
      }
    }

    ctx2d.clearRect(0, 0, W, H);
    paintBars();
  }

  function paintBars() {
    const n = bars.length;
    const gap = Math.max(3, W * 0.0045);
    const bw = Math.max(2, (W - gap * (n - 1)) / n);
    const maxH = H * 0.86;
    const baseY = H - 2;

    ctx2d.fillStyle = barGrad;
    for (let i = 0; i < n; i++) {
      const h = Math.max(3, bars[i] * maxH);
      const x = i * (bw + gap);
      roundRect(ctx2d, x, baseY - h, bw, h, Math.min(bw / 2, 4));
      ctx2d.fill();
    }

    ctx2d.fillStyle = 'rgba(255,255,255,.62)';
    for (let i = 0; i < n; i++) {
      const p = peaks[i] * maxH;
      if (p > 8) {
        const x = i * (bw + gap);
        roundRect(ctx2d, x, baseY - p - 5, bw, 2, 1);
        ctx2d.fill();
      }
    }

    ctx2d.fillStyle = 'rgba(255,255,255,.06)';
    ctx2d.fillRect(0, H - 1, W, 1);
  }

  const vizObserver = 'ResizeObserver' in window
    ? new ResizeObserver(() => resizeViz())
    : null;
  if (vizObserver && canvas.parentElement) vizObserver.observe(canvas.parentElement);
  window.addEventListener('resize', resizeViz);
  window.addEventListener('pagehide', () => {
    stopViz();
    if (vizObserver) vizObserver.disconnect();
  });
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      if (vizObserver && canvas.parentElement) vizObserver.observe(canvas.parentElement);
      resizeViz();
      startViz();
    }
  });

  /* ---------------- UI events ---------------- */
  el.play.addEventListener('click', togglePlay);
  el.prev.addEventListener('click', prevTrack);
  el.next.addEventListener('click', nextTrack);

  el.shuffle.addEventListener('click', () => {
    state.shuffle = !state.shuffle;
    updateModeUI();
    toast(state.shuffle ? '隨機播放：開' : '隨機播放：關');
  });

  el.repeat.addEventListener('click', () => {
    state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
    updateModeUI();
    toast(
      state.repeat === 'all' ? '清單循環' : state.repeat === 'one' ? '單曲循環' : '不循環'
    );
  });

  el.seek.addEventListener('input', () => {
    state.seeking = true;
    const p = Number(el.seek.value) / 1000;
    el.seekFill.style.width = (p * 100).toFixed(2) + '%';
    if (Number.isFinite(audio.duration)) {
      el.cur.textContent = fmt(p * audio.duration);
    }
  });

  el.seek.addEventListener('change', () => {
    if (Number.isFinite(audio.duration)) {
      audio.currentTime = (Number(el.seek.value) / 1000) * audio.duration;
    }
    state.seeking = false;
    syncSeek();
  });

  el.volume.addEventListener('input', () => {
    applyVolume(Number(el.volume.value) / 100);
  });

  el.mute.addEventListener('click', () => {
    if (audio.muted || audio.volume === 0) {
      applyVolume(state.lastVolume || 0.8);
    } else {
      audio.muted = true;
      updateMuteUI();
    }
  });

  el.speed.addEventListener('change', () => {
    const rate = parseFloat(el.speed.value) || 1;
    audio.playbackRate = rate;
    toast(`播放速度 ${el.speed.value}×`);
  });

  el.pick.addEventListener('click', () => el.file.click());
  el.dropzone.addEventListener('click', () => el.file.click());
  el.demo.addEventListener('click', () => addDemoTracks(true));

  el.file.addEventListener('change', () => {
    if (el.file.files && el.file.files.length) addFiles(el.file.files);
    el.file.value = '';
  });

  /* ---------------- Drag & drop ---------------- */
  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');

  window.addEventListener('dragenter', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth++;
    el.overlay.classList.add('on');
  });

  window.addEventListener('dragover', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });

  window.addEventListener('dragleave', (e) => {
    if (!hasFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) el.overlay.classList.remove('on');
  });

  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    el.overlay.classList.remove('on');
    addFiles(e.dataTransfer.files);
  });

  /* ---------------- Keyboard ---------------- */
  function isEditableTarget(target) {
    if (!target) return false;
    const tag = target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'A') return true;
    if (target.isContentEditable) return true;
    // 兼容 contenteditable="true"/"" 的巢狀結構
    const node = target.closest ? target.closest('[contenteditable]') : null;
    if (node && node.getAttribute('contenteditable') !== 'false') return true;
    return false;
  }

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (isEditableTarget(e.target)) return;

    switch (e.key) {
      case ' ':
      case 'Spacebar':
        e.preventDefault();
        togglePlay();
        break;
      case 'ArrowRight':
        e.preventDefault();
        seekBy(5);
        break;
      case 'ArrowLeft':
        e.preventDefault();
        seekBy(-5);
        break;
      case 'ArrowUp':
        e.preventDefault();
        applyVolume(audio.volume + 0.05);
        break;
      case 'ArrowDown':
        e.preventDefault();
        applyVolume(audio.volume - 0.05);
        break;
      case 'm':
      case 'M':
        e.preventDefault();
        el.mute.click();
        break;
      case 'n':
      case 'N':
        e.preventDefault();
        nextTrack();
        break;
      case 'p':
      case 'P':
        e.preventDefault();
        prevTrack();
        break;
      default:
        break;
    }
  });

  /* ---------------- Init ---------------- */
  function init() {
    applyVolume(0.8);
    updateModeUI();
    updatePlayUI();
    updateNowPlaying(null);
    addDemoTracks(false);
    resizeViz();
    startViz();

    // 系統「減少動態效果」設定改變時，立即停止或恢復 rAF 迴圈
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      const onChange = (e) => {
        if (e.matches) stopViz();
        else startViz();
      };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  }

  init();
})();
</script>
</body>
</html>
